<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Health & Medical</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#d4af37; --border:#334155; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:linear-gradient(135deg,#0b1220,#111827); color:var(--text); }
    .wrap { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0 0 18px; color:var(--muted); }
    .grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .full { grid-column:1 / -1; }
    label { font-size:14px; font-weight:600; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#0b1220; color:var(--text); }
    input[type="date"], input[type="datetime-local"] { cursor:pointer; color-scheme: dark; }
    textarea { min-height:100px; resize:vertical; }
    button[type="submit"] { margin-top:18px; border:none; background:var(--accent); color:#111827; font-weight:700; padding:12px 16px; border-radius:10px; cursor:pointer; width:100%; }
    .form-tabs { display:flex; gap:8px; margin-bottom:18px; }
    .form-tab {
      flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
      background:rgba(255,255,255,0.04); color:var(--muted); font-weight:600; font-size:13px; cursor:pointer;
    }
    .form-tab.active { background:rgba(212,175,55,0.15); border-color:rgba(212,175,55,0.45); color:var(--accent); }
    .form-panel { display:none; }
    .form-panel.active { display:block; }
    @media (max-width: 640px) { .grid { grid-template-columns:1fr; } }
    body.app-page { padding: 0; padding-bottom: max(24px, env(safe-area-inset-bottom)); width: 100%; max-width: 100%; margin: 0; overflow-x: hidden; }
    .content.form-page-body { padding: 12px; width: 100%; max-width: 100%; }
    .wrap { width: 100%; max-width: 100%; }
    @media (min-width: 1200px) { html:not(.app-fullwidth) body.app-page { max-width: 760px; margin: 0 auto; } html:not(.app-fullwidth) .wrap { max-width: 760px; } }
  </style>
</head>
<body class="app-page">
<script>
  window.__APP_PAGE__ = '<?= appPage ?>';
  window.__APP_TAB__ = '<?= appTab ?>';
</script>
<?!= include('AppChrome'); ?>
<div class="content form-page-body">
  <main class="wrap">
    <h1>Health & Medical</h1>
    <p>Daily health checks and vet medical records.</p>

    <div class="form-tabs" role="tablist">
      <button type="button" class="form-tab active" data-panel="health" id="tabHealth">🏥 Health Check</button>
      <button type="button" class="form-tab" data-panel="medical" id="tabMedical">🩺 Medical Record</button>
    </div>

    <div id="panel-health" class="form-panel active" role="tabpanel">
      <p style="margin-top:0">Sheet: HorseHealthData</p>
      <form id="healthCheckForm" novalidate>
        <div class="grid">
          <div class="field"><label for="healthDate">Date</label><input id="healthDate" name="Date" type="date" required></div>
          <div class="field">
            <label for="healthLocation">Location</label>
            <select id="healthLocation" name="Location" required><option value="">Select location</option></select>
          </div>
          <div class="field">
            <label for="healthHorse">Horse</label>
            <select id="healthHorse" name="Horse" required disabled><option value="">Select location first</option></select>
          </div>
          <div class="field">
            <label for="temp">Temp</label>
            <select id="temp" name="Temp" required><option value="">Select</option><option>Normal</option><option>Slight High</option><option>High</option></select>
          </div>
          <div class="field">
            <label for="appetite">Appetite</label>
            <select id="appetite" name="Appetite" required><option value="">Select</option><option>Normal</option><option>Reduced</option><option>Not Eating</option></select>
          </div>
          <div class="field">
            <label for="water">Water</label>
            <select id="water" name="Water" required><option value="">Select</option><option>Normal</option><option>Low</option></select>
          </div>
          <div class="field">
            <label for="dung">Dung</label>
            <select id="dung" name="Dung" required><option value="">Select</option><option>Normal</option><option>Loose</option></select>
          </div>
          <div class="field">
            <label for="injury">Injury</label>
            <select id="injury" name="Injury" required><option value="">Select</option><option>None</option><option>Minor</option><option>Serious</option></select>
          </div>
          <div class="field">
            <label for="medication">Medication</label>
            <select id="medication" name="Medication" required><option value="">Select</option><option>No</option><option>Yes</option></select>
          </div>
          <div class="field full">
            <label for="healthNotes">Notes</label>
            <textarea id="healthNotes" name="Notes" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <button type="submit">Submit Health Check</button>
      </form>
    </div>

    <div id="panel-medical" class="form-panel" role="tabpanel">
      <p style="margin-top:0">Sheet: MedicalHistory</p>
      <form id="medicalRecordForm" novalidate>
        <div class="grid">
          <div class="field"><label for="timestamp">Timestamp</label><input id="timestamp" name="Timestamp" type="datetime-local" required></div>
          <div class="field"><label for="medicalDate">Date</label><input id="medicalDate" name="Date" type="date" required></div>
          <div class="field">
            <label for="medicalHorse">Horse</label>
            <select id="medicalHorse" name="Horse" required><option value="">Select horse</option></select>
          </div>
          <div class="field"><label for="issue">Issue</label><input id="issue" name="Issue" type="text" required></div>
          <div class="field full"><label for="diagnosis">Diagnosis</label><textarea id="diagnosis" name="Diagnosis" required></textarea></div>
          <div class="field full"><label for="treatment">Treatment</label><textarea id="treatment" name="Treatment" required></textarea></div>
          <div class="field full"><label for="medicines">Medicines</label><textarea id="medicines" name="Medication" required></textarea></div>
          <div class="field"><label for="followUp">Follow-up</label><input id="followUp" name="FollowUp" type="date"></div>
          <div class="field"><label for="vet">Vet</label><input id="vet" name="Vet" type="text" required></div>
          <div class="field full">
            <label for="medicalNotes">Notes</label>
            <textarea id="medicalNotes" name="Notes" placeholder="e.g. Severe, Mild, Monitor"></textarea>
          </div>
        </div>
        <button type="submit">Submit Medical Record</button>
      </form>
    </div>
  </main>
</div>
<script>
  const PAGE_KEY = "form-health-medical";
  const healthLocationEl = document.getElementById("healthLocation");
  const healthHorseEl = document.getElementById("healthHorse");
  const healthDateEl = document.getElementById("healthDate");
  const medicalDateEl = document.getElementById("medicalDate");
  const timestampEl = document.getElementById("timestamp");
  const medicalHorseEl = document.getElementById("medicalHorse");

  function redirectToApp(url) {
    if (!url) return;
    try {
      if (window.top && window.top !== window.self) {
        window.top.location.replace(url);
        return;
      }
    } catch (e) {}
    try {
      var link = document.createElement("a");
      link.href = url;
      link.target = "_top";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
      return;
    } catch (e2) {}
    window.location.replace(url);
  }

  function goToLogin() {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(redirectToApp).getLoginUrl(PAGE_KEY);
      return;
    }
    redirectToApp("?page=login");
  }

  function syncTokenFromUrl() {
    var p = new URLSearchParams(window.location.search);
    var token = p.get("token");
    if (token) localStorage.setItem("opsAuthToken", token);
  }

  function getAuthToken() {
    syncTokenFromUrl();
    return localStorage.getItem("opsAuthToken") || "";
  }

  function requireAuth() {
    var token = getAuthToken();
    if (!token) {
      goToLogin();
      return "";
    }
    return token;
  }

  function getPayload(formEl) {
    return Object.fromEntries(new FormData(formEl).entries());
  }

  function fillSelect(selectEl, values, placeholder, disabled) {
    selectEl.innerHTML = "";
    var emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = placeholder || "Select";
    selectEl.appendChild(emptyOpt);
    (values || []).forEach(function(value) {
      var opt = document.createElement("option");
      opt.value = typeof value === "object" ? value.value : value;
      opt.textContent = typeof value === "object" ? (value.label || value.value) : value;
      selectEl.appendChild(opt);
    });
    selectEl.disabled = !!disabled;
  }

  function handleDropdownError(error) {
    if (String(error && error.message || "").toLowerCase().includes("unauthorized")) {
      localStorage.removeItem("opsAuthToken");
      goToLogin();
      return;
    }
    alert("Unable to load data: " + (error && error.message ? error.message : error));
  }

  function setDefaultDates() {
    var now = new Date();
    healthDateEl.value = now.toISOString().slice(0, 10);
    medicalDateEl.value = now.toISOString().slice(0, 10);
    timestampEl.value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }
  setDefaultDates();

  function showPanel(name) {
    document.querySelectorAll(".form-tab").forEach(function(btn) {
      btn.classList.toggle("active", btn.getAttribute("data-panel") === name);
    });
    document.querySelectorAll(".form-panel").forEach(function(panel) {
      panel.classList.toggle("active", panel.id === "panel-" + name);
    });
    try {
      history.replaceState(null, "", "?page=form-health-medical&tab=" + encodeURIComponent(name));
    } catch (e) {}
  }

  document.querySelectorAll(".form-tab").forEach(function(btn) {
    btn.addEventListener("click", function() {
      showPanel(btn.getAttribute("data-panel") || "health");
    });
  });

  function loadHealthBootstrap() {
    var token = requireAuth();
    if (!token || !(window.google && google.script && google.script.run)) return;
    google.script.run
      .withSuccessHandler(function(data) {
        if (window.AppLocation) {
          window.AppLocation.applyField(healthLocationEl, data);
        } else {
          fillSelect(healthLocationEl, data.locations || data.Location || [], "Select location", false);
        }
        if (data.locationLocked && healthLocationEl.value) {
          loadHealthHorses(healthLocationEl.value);
        } else {
          fillSelect(healthHorseEl, [], "Select location first", true);
        }
      })
      .withFailureHandler(handleDropdownError)
      .getHealthFormBootstrap(token);
  }

  function loadHealthHorses(location) {
    var token = requireAuth();
    if (!token || !location) {
      fillSelect(healthHorseEl, [], "Select location first", true);
      return;
    }
    google.script.run
      .withSuccessHandler(function(data) {
        fillSelect(healthHorseEl, data.horses || [], "Select horse", false);
      })
      .withFailureHandler(handleDropdownError)
      .getHealthOptionsForLocation(location, token);
  }

  healthLocationEl.addEventListener("change", function() {
    var loc = healthLocationEl.value;
    if (!loc) {
      fillSelect(healthHorseEl, [], "Select location first", true);
      return;
    }
    fillSelect(healthHorseEl, [], "Loading…", true);
    loadHealthHorses(loc);
  });

  function loadMedicalHorses() {
    var token = requireAuth();
    if (!token || !(window.google && google.script && google.script.run)) return;
    google.script.run
      .withSuccessHandler(function(options) {
        fillSelect(medicalHorseEl, options.Horse || [], "Select horse", false);
      })
      .withFailureHandler(handleDropdownError)
      .getDropdownOptions("medical", token);
  }

  document.getElementById("healthCheckForm").addEventListener("submit", function(e) {
    if (!this.checkValidity()) { e.preventDefault(); this.reportValidity(); return; }
    e.preventDefault();
    var payload = getPayload(this);
    var token = requireAuth();
    if (token && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {
          alert("Health check submitted.");
          document.getElementById("healthCheckForm").reset();
          setDefaultDates();
          loadHealthBootstrap();
        })
        .withFailureHandler(function(error) {
          if (String(error.message || "").toLowerCase().includes("unauthorized")) {
            localStorage.removeItem("opsAuthToken");
            goToLogin();
            return;
          }
          alert("Submit failed: " + error.message);
        })
        .submitFormData("health", payload, token);
      return;
    }
    alert("Health check submitted (preview mode).");
  });

  document.getElementById("medicalRecordForm").addEventListener("submit", function(e) {
    if (!this.checkValidity()) { e.preventDefault(); this.reportValidity(); return; }
    e.preventDefault();
    var payload = getPayload(this);
    var token = requireAuth();
    if (token && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {
          alert("Medical record submitted.");
          document.getElementById("medicalRecordForm").reset();
          setDefaultDates();
          loadMedicalHorses();
        })
        .withFailureHandler(function(error) {
          if (String(error.message || "").toLowerCase().includes("unauthorized")) {
            localStorage.removeItem("opsAuthToken");
            goToLogin();
            return;
          }
          alert("Submit failed: " + error.message);
        })
        .submitFormData("medical", payload, token);
      return;
    }
    alert("Medical record submitted (preview mode).");
  });

  var bootTab = (window.__APP_TAB__ || new URLSearchParams(window.location.search).get("tab") || "health").toLowerCase();
  if (bootTab === "medical") showPanel("medical");
  else showPanel("health");

  loadHealthBootstrap();
  loadMedicalHorses();
</script>
</body>
</html>
