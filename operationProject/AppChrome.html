<script>
(function (global) {
  function isMobileUa() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(
      global.navigator.userAgent || ""
    );
  }

  /** Real phone width — never the oversized GAS iframe innerWidth. */
  function getRealMobileWidth() {
    var vv = global.visualViewport;
    if (vv && vv.width > 0 && vv.width < 900) {
      return Math.round(vv.width);
    }
    if (global.screen && global.screen.width) {
      var portrait = Math.min(global.screen.width, global.screen.height || global.screen.width);
      if (portrait > 0 && portrait < 900) {
        return Math.round(portrait);
      }
    }
    if (isMobileUa()) {
      return 390;
    }
    var iw = global.innerWidth || 0;
    return Math.round(iw > 0 && iw < 600 ? iw : 390);
  }

  function isMobileDevice() {
    if (isMobileUa()) {
      return true;
    }
    if (global.screen && global.screen.width) {
      var shortSide = Math.min(global.screen.width, global.screen.height || global.screen.width);
      if (shortSide > 0 && shortSide <= 768) {
        return true;
      }
    }
    if (global.visualViewport && global.visualViewport.width > 0 && global.visualViewport.width <= 768) {
      return true;
    }
    return false;
  }

  function updateViewportMeta() {
    if (!isMobileDevice()) {
      return;
    }
    var w = getRealMobileWidth();
    var meta = global.document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = global.document.createElement("meta");
      meta.setAttribute("name", "viewport");
      global.document.head.appendChild(meta);
    }
    meta.setAttribute(
      "content",
      "width=" + w + ", initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    );
  }

  function fitGoogleScriptHostFrame() {
    try {
      if (!global.google || !global.google.script || !global.google.script.host) {
        return;
      }
      var host = global.google.script.host;
      var w = getRealMobileWidth();
      if (w >= 280 && typeof host.setWidth === "function") {
        host.setWidth(w);
      }
    } catch (err) {
      if (global.console && global.console.warn) {
        global.console.warn("[KingsOps Viewport] setWidth:", err);
      }
    }
  }

  /** When iframe stays ~760px, zoom so layout matches ~360px phone (Chrome/Android). */
  function applyLayoutScaleFix() {
    var root = global.document.documentElement;
    if (!root) {
      return;
    }
    if (!isMobileDevice()) {
      root.style.zoom = "";
      root.classList.remove("app-scaled");
      return;
    }
    var layoutW = root.clientWidth || global.innerWidth || 0;
    var targetW = getRealMobileWidth();
    if (layoutW > targetW + 24) {
      var scale = targetW / layoutW;
      scale = Math.max(0.4, Math.min(1, scale));
      root.style.zoom = String(scale);
      root.classList.add("app-scaled");
    } else {
      root.style.zoom = "1";
      root.classList.remove("app-scaled");
    }
  }

  function fitHostHeightToContent() {
    try {
      if (!global.google || !global.google.script || !global.google.script.host) {
        return;
      }
      if (typeof global.google.script.host.setHeight !== "function") {
        return;
      }
      var root = global.document.documentElement;
      var zoom = parseFloat(root.style.zoom) || 1;
      var scrollH = Math.max(
        global.document.body.scrollHeight || 0,
        root.scrollHeight || 0
      );
      var h = Math.ceil(scrollH * zoom) + 24;
      var cap = global.visualViewport
        ? Math.round(global.visualViewport.height + 48)
        : 720;
      global.google.script.host.setHeight(Math.min(Math.max(h, 360), cap));
    } catch (err) {
      if (global.console && global.console.warn) {
        global.console.warn("[KingsOps Viewport] setHeight:", err);
      }
    }
  }

  function applyAppMobileClass() {
    var root = global.document.documentElement;
    if (!root) {
      return;
    }
    if (isMobileDevice()) {
      root.classList.add("app-mobile");
      root.style.fontSize = "18px";
    } else {
      root.classList.remove("app-mobile");
      root.style.fontSize = "";
    }
  }

  function applyAppFullWidth() {
    var root = global.document.documentElement;
    if (!root) {
      return;
    }
    var hostname = (global.location.hostname || "").toLowerCase();
    var inFrame = global.self !== global.top;
    var gasHost =
      hostname.indexOf("script.google.com") >= 0 ||
      hostname.indexOf("googleusercontent.com") >= 0;
    if (inFrame || gasHost || isMobileDevice()) {
      root.classList.add("app-fullwidth");
    } else if ((global.innerWidth || 0) < 1200) {
      root.classList.add("app-fullwidth");
    } else {
      root.classList.remove("app-fullwidth");
    }
  }

  function bootViewport() {
    updateViewportMeta();
    fitGoogleScriptHostFrame();
    applyAppFullWidth();
    applyAppMobileClass();
    applyLayoutScaleFix();
    global.setTimeout(fitHostHeightToContent, 50);
    global.setTimeout(fitHostHeightToContent, 400);
  }

  function scheduleViewportPasses() {
    bootViewport();
    [0, 80, 250, 700, 1500, 3000].forEach(function (d) {
      global.setTimeout(bootViewport, d);
    });
  }

  scheduleViewportPasses();
  global.addEventListener("resize", bootViewport);
  global.addEventListener("orientationchange", function () {
    global.setTimeout(scheduleViewportPasses, 200);
  });
  if (global.visualViewport) {
    global.visualViewport.addEventListener("resize", bootViewport);
  }

  global.AppViewport = {
    boot: bootViewport,
    fitHost: fitGoogleScriptHostFrame,
    applyMobile: applyAppMobileClass,
    getDeviceWidth: getRealMobileWidth
  };
})(window);
</script>

<script>
(function() {
  var overlay = null, messageEl = null, pending = 0;
  function getOverlay() {
    if (!overlay) {
      overlay = document.getElementById('appLoaderOverlay');
      messageEl = document.getElementById('appLoaderMessage');
    }
    return overlay;
  }
  window.AppLoader = {
    show: function(message) {
      var el = getOverlay();
      if (!el) return;
      pending++;
      if (messageEl && message) messageEl.textContent = message;
      el.classList.add('is-visible');
      el.setAttribute('aria-hidden', 'false');
      document.body.classList.add('app-is-loading');
    },
    hide: function() {
      var el = getOverlay();
      if (!el) return;
      pending = Math.max(0, pending - 1);
      if (pending > 0) return;
      el.classList.remove('is-visible');
      el.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('app-is-loading');
    },
    forceHide: function() { pending = 0; this.hide(); },
    setMessage: function(text) { if (messageEl && text) messageEl.textContent = text; }
  };
})();
</script>

<script>
(function () {
  /* Viewport / host iframe sizing: AppViewport.html (include at top of AppChrome) */

  /* Set localStorage.opsDebug = "1" or add ?debug=1 to URL for extra logs */
  var OPS_DEBUG = true;

  function log() {
    if (!OPS_DEBUG || typeof console === "undefined" || !console.log) return;
    var args = ["[KingsOps Location]"].concat(Array.prototype.slice.call(arguments));
    console.log.apply(console, args);
  }

  function logWarn() {
    if (typeof console === "undefined" || !console.warn) return;
    var args = ["[KingsOps Location]"].concat(Array.prototype.slice.call(arguments));
    console.warn.apply(console, args);
  }

  function logError() {
    if (typeof console === "undefined" || !console.error) return;
    var args = ["[KingsOps Location]"].concat(Array.prototype.slice.call(arguments));
    console.error.apply(console, args);
  }

  function tokenHint(token) {
    if (!token) return "(none)";
    return token.length <= 12 ? token : token.substring(0, 8) + "…";
  }

  function summarizeContext(data) {
    if (!data) return null;
    return {
      email: data.email,
      name: data.name,
      role: data.role,
      location: data.location,
      locationId: data.locationId,
      locationLabel: data.locationLabel,
      isAdmin: data.isAdmin,
      viewLocation: data.viewLocation,
      viewLabel: data.viewLabel,
      defaultAdminLocation: data.defaultAdminLocation,
      adminOptionsCount: data.adminOptions ? data.adminOptions.length : 0,
      locationsSheetCount: data.locations ? data.locations.length : 0
    };
  }

  /* ── state ─────────────────────────────────────────────────── */
  var ctx = null;
  var SKEY = "opsViewLocation";
  var ALL  = "__ALL__";
  var ddOpen = false;

  /* ── token ─────────────────────────────────────────────────── */
  function syncToken() {
    var t = new URLSearchParams(window.location.search).get("token");
    if (t) try { localStorage.setItem("opsAuthToken", t); } catch(e){}
  }
  function getToken() { syncToken(); return localStorage.getItem("opsAuthToken") || ""; }

  /* ── session storage for admin view ────────────────────────── */
  function storedView() {
    try { var v = sessionStorage.getItem(SKEY); return v === null ? null : v === ALL ? "" : v; }
    catch(e){ return null; }
  }
  function hasStored() { try { return sessionStorage.getItem(SKEY) !== null; } catch(e){ return false; } }
  function saveView(loc) {
    try { sessionStorage.setItem(SKEY, isAll(loc) ? ALL : String(loc||"")); } catch(e){}
  }

  /* ── helpers ────────────────────────────────────────────────── */
  function isAll(v) { var s=String(v||"").trim().toLowerCase(); return !s||s==="all"||s==="all locations"; }

  function labelOf(locValue) {
    if (!ctx || !ctx.adminOptions) return locValue || "—";
    for (var i=0;i<ctx.adminOptions.length;i++){
      var o=ctx.adminOptions[i];
      if (o.value===locValue||o.id===locValue) return o.label||o.value;
    }
    return locValue || "—";
  }

  function closeDD() {
    ddOpen = false;
    var dd  = document.getElementById("appLocDropdown");
    var btn = document.getElementById("appLocPill");
    if (dd)  dd.classList.remove("is-open");
    if (btn) { btn.classList.remove("dd-open"); btn.setAttribute("aria-expanded","false"); }
  }

  function fireChanged() {
    try {
      window.dispatchEvent(new CustomEvent("ops-location-changed",{
        detail:{ viewLocation:AppLocation.getViewLocation(), viewLabel:AppLocation.getViewLabel(), context:ctx }
      }));
    } catch(e){}
  }

  /** Location display name from Users sheet / Locations tab */
  function locationNameFromCtx(c) {
    if (!c) return "—";
    if (c.location) return String(c.location).trim();
    var lbl = String(c.locationLabel || "").trim();
    if (!lbl) return "—";
    var m = lbl.match(/^LOC\d+\s*[·•·]\s*(.+)$/i);
    return m ? m[1].trim() : lbl;
  }

  function headerLocationName() {
    if (!ctx) return "—";
    if (!ctx.isAdmin) {
      return locationNameFromCtx(ctx);
    }
    if (isAll(ctx.viewLocation)) return "All Locations";
    return locationNameFromCtx({
      location: ctx.viewLocation,
      locationLabel: ctx.viewLabel
    });
  }

  function updateLocationBadge() {
    var el = document.getElementById("locationLabel");
    if (!el) {
      logWarn("updateLocationBadge: #locationLabel not found in DOM");
      return;
    }
    el.classList.remove("is-loading");
    var name = headerLocationName();
    log("updateLocationBadge →", name, "| ctx:", summarizeContext(ctx));
    el.textContent = "📍 " + name;
    if (ctx && ctx.isAdmin) {
      el.title = "Dashboard view: " + name + " (click ▼ to switch)";
    } else if (ctx) {
      var tip = "Your location: " + name;
      if (ctx.locationId) tip += " (" + ctx.locationId + ")";
      el.title = tip;
    } else {
      el.title = "Your location";
    }
  }

  /* ── role badge ─────────────────────────────────────────────── */
  function updateRoleBadge() {
    var el = document.getElementById("roleLabel");
    if (!el) {
      logWarn("updateRoleBadge: #roleLabel not found in DOM");
      return;
    }
    el.classList.remove("is-loading");
    var role = ctx ? String(ctx.role || "User") : "User";
    log("updateRoleBadge →", role, "| isAdmin:", !!(ctx && ctx.isAdmin));
    /* Capitalise first letter only, rest lower */
    el.textContent = role.charAt(0).toUpperCase() + role.slice(1).toLowerCase();
    /* Highlight admin badge distinctively */
    if (ctx && ctx.isAdmin) {
      el.style.background  = "rgba(201,168,76,0.22)";
      el.style.borderColor = "rgba(201,168,76,0.65)";
      el.style.color       = "#C9A84C";
    } else {
      el.style.background  = "";
      el.style.borderColor = "";
      el.style.color       = "";
    }
  }

  var initPending = false;
  var initCallbacks = [];

  function finishInit(result) {
    initPending = false;
    var cbs = initCallbacks.slice();
    initCallbacks = [];
    try {
      window.dispatchEvent(new CustomEvent("ops-location-ready", { detail: { context: result } }));
    } catch (e) {}
    for (var i = 0; i < cbs.length; i++) {
      try { cbs[i](result); } catch (errCb) { logError("init callback error:", errCb); }
    }
  }

  function showHeaderLoading() {
    var roleEl = document.getElementById("roleLabel");
    var locEl = document.getElementById("locationLabel");
    if (roleEl) { roleEl.textContent = "…"; roleEl.classList.add("is-loading"); }
    if (locEl) { locEl.textContent = "📍 …"; locEl.classList.add("is-loading"); }
  }

  function clearHeaderLoadingFallback(roleText, locText) {
    var roleEl = document.getElementById("roleLabel");
    if (roleEl) {
      roleEl.classList.remove("is-loading");
      roleEl.textContent = roleText || "User";
      roleEl.style.background = "";
      roleEl.style.borderColor = "";
      roleEl.style.color = "";
    }
    var locEl = document.getElementById("locationLabel");
    if (locEl) {
      locEl.classList.remove("is-loading");
      locEl.textContent = "📍 " + (locText || "—");
    }
    var wrap = document.getElementById("locControl");
    if (wrap) { wrap.innerHTML = ""; wrap.style.display = "none"; }
  }

  /* ── location: badge for everyone; admin view switcher in locControl ── */
  function render() {
    updateLocationBadge();
    var wrap = document.getElementById("locControl");
    if (!wrap || !ctx) return;
    wrap.innerHTML = "";

    if (!ctx.isAdmin) {
      wrap.style.display = "none";
      wrap.setAttribute("aria-hidden", "true");
      return;
    }

    wrap.style.display = "";
    wrap.setAttribute("aria-hidden", "false");

    if (ctx.isAdmin) {
      var viewLoc   = ctx.viewLocation || "";
      var viewIsAll = isAll(viewLoc);

      var btn = document.createElement("button");
      btn.type      = "button";
      btn.id        = "appLocPill";
      btn.className = "app-loc-pill";
      btn.style.padding = "4px 10px";
      btn.setAttribute("aria-haspopup","listbox");
      btn.setAttribute("aria-expanded","false");
      btn.title     = "Switch location view";
      btn.innerHTML = '<span class="loc-chevron" style="font-size:10px">▼</span>';

      /* Dropdown */
      var dd = document.createElement("div");
      dd.id        = "appLocDropdown";
      dd.className = "app-loc-dropdown";
      dd.setAttribute("role","listbox");
      dd.innerHTML = '<div class="app-loc-dd-header"><span>📍</span> Switch Location</div>';

      (ctx.adminOptions || []).forEach(function(opt, idx) {
        /* Divider between "All" and the real locations */
        if (idx === 1) {
          var dv = document.createElement("div"); dv.className = "app-loc-divider"; dd.appendChild(dv);
        }

        var optIsAll  = isAll(opt.value);
        var isActive  = optIsAll ? viewIsAll : opt.value === viewLoc;

        var badge = optIsAll
          ? '<span class="app-loc-opt-badge all-badge">ALL</span>'
          : (opt.id ? '<span class="app-loc-opt-badge">'+opt.id+'</span>' : '');

        var name = opt.name || (optIsAll ? "All Locations"
          : (opt.label ? opt.label.replace(/^LOC\d+\s*[·•·]\s*/i,"") : opt.value));

        var metaParts = "";
        if (optIsAll) {
          metaParts = '<span>Combined view across all locations</span>';
        } else {
          if (opt.manager) metaParts += '<span>👤 '+opt.manager+'</span>';
          if (opt.phone)   metaParts += '<span>📞 '+opt.phone+'</span>';
        }

        var item = document.createElement("button");
        item.type      = "button";
        item.className = "app-loc-option" + (isActive ? " active" : "");
        item.setAttribute("role","option");
        item.setAttribute("aria-selected", isActive ? "true" : "false");
        item.innerHTML =
          '<div class="app-loc-opt-row">' +
            badge +
            '<span class="app-loc-opt-name">'+name+'</span>' +
            (isActive ? '<span class="app-loc-opt-check">✓</span>' : '') +
          '</div>' +
          (metaParts ? '<div class="app-loc-opt-meta">'+metaParts+'</div>' : '');

        item.addEventListener("click", function(){
          ctx.viewLocation = optIsAll ? "" : opt.value;
          ctx.viewLabel    = optIsAll ? "All Locations" : labelOf(opt.value);
          saveView(ctx.viewLocation);
          updateLocationBadge();
          render();
          closeDD();
          fireChanged();
        });
        dd.appendChild(item);
      });

      btn.addEventListener("click", function(e){
        e.stopPropagation();
        ddOpen = !ddOpen;
        dd.classList.toggle("is-open", ddOpen);
        btn.classList.toggle("dd-open", ddOpen);
        btn.setAttribute("aria-expanded", ddOpen ? "true" : "false");
      });

      wrap.appendChild(btn);
      wrap.appendChild(dd);
    }
  }

  /* ── applyField: fill / lock a location <select> in forms ───── */
  function applyField(selectEl, options) {
    if (!selectEl) return;
    options = options || {};
    var locs       = options.Location || options.locations || [];
    var locked     = !!options.locationLocked;
    var defaultLoc = options.defaultLocation || (ctx && ctx.location) || "";

    selectEl.innerHTML = "";

    if (locked && defaultLoc) {
      var o = document.createElement("option");
      o.value = defaultLoc; o.textContent = defaultLoc; o.selected = true;
      selectEl.appendChild(o);
      selectEl.value = defaultLoc;
      selectEl.disabled = true;
      selectEl.classList.add("location-locked");
      return;
    }

    selectEl.disabled = false;
    selectEl.classList.remove("location-locked");
    var emp = document.createElement("option"); emp.value=""; emp.textContent="Select location";
    selectEl.appendChild(emp);
    locs.forEach(function(v){
      var op = document.createElement("option");
      op.value = v; op.textContent = v;
      if (defaultLoc && v===defaultLoc) op.selected = true;
      selectEl.appendChild(op);
    });
    if (defaultLoc) selectEl.value = defaultLoc;
  }

  /* ── close dropdown on outside click ────────────────────────── */
  document.addEventListener("click", closeDD);

  function scriptReady() {
    return !!(window.google && google.script && google.script.run);
  }

  function fetchContext(cb, attempt) {
    attempt = attempt || 0;
    var token = getToken();
    log("fetchContext attempt", attempt, "| token:", tokenHint(token), "| scriptReady:", scriptReady());

    if (!token) {
      logError("No auth token — check Login redirect and localStorage.opsAuthToken");
      clearHeaderLoadingFallback("Guest", "Sign in");
      finishInit(null);
      return;
    }
    if (!scriptReady()) {
      if (attempt < 40) {
        if (attempt === 0) logWarn("google.script.run not ready yet, retrying…");
        setTimeout(function() { fetchContext(cb, attempt + 1); }, 50);
        return;
      }
      logError("google.script.run still unavailable after retries — open deployed /exec URL");
      clearHeaderLoadingFallback("User", "Offline");
      finishInit(null);
      return;
    }

    var sv = storedView();
    log("Calling backend getAppContext | storedView:", sv, "| viewParam:", sv === null ? "(empty→server)" : sv);

    google.script.run
      .withSuccessHandler(function(data) {
        log("getAppContext SUCCESS — raw response:", data);
        log("getAppContext summary:", summarizeContext(data));
        ctx = data || null;
        if (!ctx) {
          logError("Backend returned null/empty context");
        }
        if (ctx && ctx.isAdmin) {
          if (!hasStored()) {
            var def = ctx.defaultAdminLocation || ctx.defaultAdminLocationId || "";
            if (!def && ctx.adminOptions && ctx.adminOptions.length) {
              for (var i = 0; i < ctx.adminOptions.length; i++) {
                if (ctx.adminOptions[i].id === "LOC004") {
                  def = ctx.adminOptions[i].value;
                  break;
                }
              }
            }
            ctx.viewLocation = def;
            ctx.viewLabel = def ? labelOf(def) : (ctx.viewLabel || "All Locations");
            saveView(ctx.viewLocation);
          } else {
            ctx.viewLocation = isAll(sv) ? "" : sv;
            ctx.viewLabel = isAll(sv) ? "All Locations" : labelOf(sv);
          }
        }
        updateRoleBadge();
        updateLocationBadge();
        render();
        var roleEl = document.getElementById("roleLabel");
        var locEl = document.getElementById("locationLabel");
        log("Header after load — role:", roleEl ? roleEl.textContent : "(missing)",
            "| location:", locEl ? locEl.textContent : "(missing)");
        finishInit(ctx);

        if (OPS_DEBUG && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(dbg) {
              log("debugAppContext (server) —", dbg);
            })
            .withFailureHandler(function(e) {
              logError("debugAppContext failed:", e);
            })
            .debugAppContext(token, sv === null ? "" : sv);
        }
      })
      .withFailureHandler(function(err) {
        ctx = null;
        var msg = err && err.message ? err.message : String(err || "unknown error");
        logError("getAppContext FAILED:", msg, err);
        if (String(msg).toLowerCase().indexOf("unauthorized") >= 0) {
          logError("Session invalid — log in again; token was:", tokenHint(token));
          clearHeaderLoadingFallback("Session expired", "—");
        } else {
          clearHeaderLoadingFallback("User", "—");
        }
        finishInit(null);

        if (google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(dbg) {
              log("debugAppContext after failure —", dbg);
            })
            .withFailureHandler(function(e2) {
              logError("debugAppContext after failure also failed:", e2);
            })
            .debugAppContext(token, sv === null ? "" : sv);
        }
      })
      .getAppContext(token, sv === null ? "" : sv);
  }

  /* ── public API ─────────────────────────────────────────────── */
  var AppLocation = {
    init: function(cb) {
      log("AppLocation.init() | hasCtx:", !!ctx, "| initPending:", initPending,
          "| DOM roleLabel:", !!document.getElementById("roleLabel"),
          "| DOM locationLabel:", !!document.getElementById("locationLabel"));

      if (ctx) {
        log("Using cached context:", summarizeContext(ctx));
        updateRoleBadge();
        updateLocationBadge();
        render();
        if (cb) cb(ctx);
        return;
      }
      if (initPending) {
        log("Init already in progress — queue callback");
        if (cb) initCallbacks.push(cb);
        return;
      }

      log("Starting header load (showing … until backend responds)");
      showHeaderLoading();

      initPending = true;
      if (cb) initCallbacks.push(cb);
      fetchContext(function() { /* finishInit handles callbacks */ });
    },

    refresh: function(cb) { ctx = null; initPending = false; initCallbacks = []; this.init(cb); },

    getContext:      function() { return ctx; },
    isAdmin:         function() { return !!(ctx && ctx.isAdmin); },
    isLocked:        function() { return !!(ctx && ctx.locationLocked); },
    getUserLocation: function() { return ctx ? (ctx.location || "") : ""; },

    getViewLocation: function() {
      if (!ctx) return "";
      if (ctx.isAdmin) {
        var s = storedView();
        return s === null ? (ctx.defaultAdminLocation || "") : (isAll(s) ? "" : s);
      }
      return ctx.location || "";
    },

    getViewLabel: function() {
      if (!ctx) return "";
      return ctx.isAdmin
        ? (ctx.viewLabel || "All Locations")
        : (ctx.locationLabel || ctx.location || "");
    },

    applyField: applyField,

    withDropdownOptions: function(serverOpts) {
      var opts = serverOpts || {};
      if (ctx && ctx.locationLocked) {
        opts.locationLocked  = true;
        opts.defaultLocation = ctx.location;
        opts.Location        = [ctx.location];
      }
      return opts;
    }
  };

  window.AppLocation = AppLocation;

  /* NOTE: Auto-boot removed.
     AppChrome.html calls AppLocation.init() explicitly from its own
     <script> block, which runs after #roleLabel and #locControl exist in the DOM. */
})();
</script>

<script>
(function() {
  function syncTokenFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      try { localStorage.setItem('opsAuthToken', token); } catch (e) {}
    }
  }

  function getAuthToken() {
    syncTokenFromUrl();
    return localStorage.getItem('opsAuthToken') || '';
  }

  function redirectToApp(url) {
    if (!url) return;
    try {
      if (window.top && window.top !== window.self) {
        window.top.location.replace(url);
        return;
      }
    } catch (e) {}
    try {
      var link = document.createElement('a');
      link.href = url;
      link.target = '_top';
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      link.remove();
      return;
    } catch (e2) {}
    window.location.replace(url);
  }

  window.appNavigate = function(targetPage, tab) {
    var token = getAuthToken();
    var label = targetPage === 'login' ? 'Signing out…' : 'Loading…';
    if (window.AppLoader) {
      window.AppLoader.show(label);
    }
    if (!token) {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(url) { redirectToApp(url); })
          .withFailureHandler(function() { if (window.AppLoader) window.AppLoader.hide(); })
          .getLoginUrl('');
      } else {
        if (window.AppLoader) window.AppLoader.hide();
        redirectToApp('?page=login');
      }
      return;
    }
    if (!(window.google && google.script && google.script.run)) {
      if (window.AppLoader) window.AppLoader.hide();
      redirectToApp('?page=' + encodeURIComponent(targetPage || 'dashboard'));
      return;
    }
    google.script.run
      .withSuccessHandler(function(url) {
        if (tab) {
          url += (url.indexOf('?') >= 0 ? '&' : '?') + 'tab=' + encodeURIComponent(tab);
        }
        redirectToApp(url);
      })
      .withFailureHandler(function() {
        if (window.AppLoader) window.AppLoader.hide();
        redirectToApp(window.location.href.split('?')[0] + '?page=' + (targetPage || 'dashboard'));
      })
      .buildAppPageUrl(targetPage || 'dashboard', token, '', tab || '');
  };

  function setActiveNav(tab) {
    if (tab === 'medical') tab = 'health';
    var active = tab || 'dashboard';
    document.querySelectorAll('.app-main-nav .nav-btn').forEach(function(btn) {
      var btnTab = btn.getAttribute('data-tab') || '';
      btn.classList.toggle('active', btnTab === active);
    });
  }

  document.querySelectorAll('.app-main-nav .nav-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tab  = btn.getAttribute('data-tab')  || 'dashboard';
      var page = btn.getAttribute('data-nav')  || 'dashboard';
      var currentPage = (window.__APP_PAGE__ || '').toLowerCase();
      if (page === 'dashboard' && currentPage === 'dashboard' && typeof window.showPage === 'function') {
        window.showPage(tab === 'medical' ? 'health' : tab);
        setActiveNav(tab);
        return;
      }
      window.appNavigate(page, tab);
    });
  });

  syncTokenFromUrl();
  var bootTab = (window.__APP_TAB__ || new URLSearchParams(window.location.search).get('tab') || 'dashboard');
  setActiveNav(bootTab);

  var liveDate = document.getElementById('liveDate');
  if (liveDate) {
    var now = new Date();
    liveDate.textContent = now.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function() {
      if (logoutBtn.disabled) return;
      var token = getAuthToken();
      logoutBtn.disabled = true;
      logoutBtn.textContent = '…';
      if (window.AppLoader) window.AppLoader.show('Signing out…');
      function finishLogout() {
        try { localStorage.removeItem('opsAuthToken'); } catch (e) {}
        window.appNavigate('login', '');
      }
      if (window.google && google.script && google.script.run && token) {
        google.script.run
          .withSuccessHandler(finishLogout)
          .withFailureHandler(function() {
            logoutBtn.disabled = false;
            logoutBtn.textContent = 'Logout';
            if (window.AppLoader) window.AppLoader.hide();
            finishLogout();
          })
          .logoutUser(token);
        return;
      }
      finishLogout();
    });
  }

  function bootAppLocation() {
    console.log("[KingsOps Chrome] bootAppLocation | AppLocation:", !!window.AppLocation,
      "| token in URL:", !!new URLSearchParams(window.location.search).get("token"),
      "| token in localStorage:", !!localStorage.getItem("opsAuthToken"));
    if (window.AppLocation) {
      window.AppLocation.init();
    } else {
      console.error("[KingsOps Chrome] AppLocation failed to load — redeploy the latest AppChrome.html (embedded script).");
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootAppLocation);
  } else {
    bootAppLocation();
  }
})();
</script>
