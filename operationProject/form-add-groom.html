<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title><?= editGroomName ? 'Edit Groom' : 'Add Groom' ?> (Grooms)</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#d4af37; --border:#334155; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:linear-gradient(135deg,#0b1220,#111827); color:var(--text); padding:16px; padding-top:max(16px, env(safe-area-inset-top)); }
    .wrap { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0 0 18px; color:var(--muted); }
    .grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .full { grid-column:1 / -1; }
    label { font-size:14px; font-weight:600; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#0b1220; color:var(--text); }
    input[type="date"] { cursor:pointer; color-scheme: dark; }
    button { margin-top:18px; border:none; background:var(--accent); color:#111827; font-weight:700; padding:12px 16px; border-radius:10px; cursor:pointer; width:100%; }
    @media (max-width: 640px) { .grid { grid-template-columns:1fr; } }
    body.app-page { padding: 0; padding-bottom: max(24px, env(safe-area-inset-bottom)); width: 100%; max-width: 100%; margin: 0; overflow-x: hidden; }
    .content.form-page-body { padding: 12px; width: 100%; max-width: 100%; }
    .wrap { width: 100%; max-width: 100%; }
    @media (min-width: 1200px) { html:not(.app-fullwidth) body.app-page { max-width: 760px; margin: 0 auto; } html:not(.app-fullwidth) .wrap { max-width: 760px; } }
  </style>
</head>
<body class="app-page">
<script>
  window.__APP_PAGE__ = '<?= appPage ?>';
  window.__APP_TAB__ = 'forms';
  window.__EDIT_GROOM_NAME__ = '<?= editGroomName ?>';
</script>
<?!= include('AppChrome'); ?>
<?!= include('ProfilePhoto'); ?>
<div class="content form-page-body">
  <main class="wrap">
    <h1 id="formTitle">Add New Groom</h1>
    <p id="formSubtitle">Sheet: Grooms — add a groom to your team at a location.</p>
    <form id="addGroomForm" novalidate>
      <div class="grid">
        <div class="field full">
          <label for="groomName">Groom Name</label>
          <input id="groomName" name="Groom_Name" type="text" required placeholder="Full name">
        </div>
        <div class="field">
          <label for="aadharNumber">Aadhar Number</label>
          <input id="aadharNumber" name="Aadhar_Number" type="text" inputmode="numeric" maxlength="12" placeholder="12-digit Aadhar">
        </div>
        <div class="field">
          <label for="dateOfJoining">Date of joining</label>
          <input id="dateOfJoining" name="Date_Of_Joining" type="date">
        </div>
        <div class="field full" id="groomPhotoMount"></div>
        <div class="field full" id="groomPassportPhotoMount"></div>
        <div class="field full" style="margin-top:4px;padding-top:12px;border-top:1px solid var(--border)">
          <label style="color:var(--accent)">Bank details</label>
        </div>
        <div class="field">
          <label for="bankName">Bank name</label>
          <input id="bankName" name="Bank_Name" type="text" placeholder="e.g. SBI, HDFC">
        </div>
        <div class="field">
          <label for="bankAccountNo">Account no.</label>
          <input id="bankAccountNo" name="Bank_Account_No" type="text" inputmode="numeric" placeholder="Bank account number">
        </div>
        <div class="field">
          <label for="ifscCode">IFSC code</label>
          <input id="ifscCode" name="IFSC_Code" type="text" placeholder="e.g. SBIN0001234" style="text-transform:uppercase">
        </div>
        <div class="field full" id="groomPassbookPhotoMount"></div>
        <div class="field">
          <label for="location">Location</label>
          <select id="location" name="Location" required><option value="">Select location</option></select>
        </div>
        <div class="field">
          <label for="shift">Shift</label>
          <select id="shift" name="Shift">
            <option value="">—</option>
            <option>Morning</option>
            <option>Evening</option>
            <option>Full Day</option>
          </select>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="Phone" type="tel" placeholder="Contact number">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="Status">
            <option value="Active" selected>Active</option>
            <option>Leave</option>
            <option>Inactive</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submitBtn"><?= editGroomName ? 'Save Changes' : 'Add Groom' ?></button>
    </form>
  </main>
</div>
<script>
  const FORM_KEY = "groom";
  const PAGE_KEY = "form-add-groom";
  let editMode = false;
  let editOriginalName = "";

  function redirectToApp(url) {
    if (!url) return;
    try {
      if (window.top && window.top !== window.self) {
        window.top.location.replace(url);
        return;
      }
    } catch (e) {}
    window.location.replace(url);
  }

  function goToLogin() {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(redirectToApp).getLoginUrl(PAGE_KEY);
      return;
    }
    redirectToApp("?page=login");
  }

  function syncTokenFromUrl() {
    const p = new URLSearchParams(window.location.search);
    const token = p.get("token");
    if (token) localStorage.setItem("opsAuthToken", token);
  }

  function getAuthToken() {
    syncTokenFromUrl();
    return localStorage.getItem("opsAuthToken") || "";
  }

  function requireAuth() {
    const token = getAuthToken();
    if (!token) {
      goToLogin();
      return "";
    }
    return token;
  }

  function getPayload(formEl) {
    return Object.fromEntries(new FormData(formEl).entries());
  }

  function fillSelect(selectEl, values, placeholder) {
    selectEl.innerHTML = "";
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = placeholder || "Select";
    selectEl.appendChild(emptyOpt);
    (values || []).forEach(function(value) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = value;
      selectEl.appendChild(opt);
    });
  }

  function formatDateForInput(val) {
    if (!val) return "";
    if (val instanceof Date && !isNaN(val.getTime())) {
      return val.toISOString().slice(0, 10);
    }
    var s = String(val).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var d = new Date(s);
    return isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
  }

  function fillGroomForm(data) {
    document.getElementById("groomName").value = data.Groom_Name || "";
    document.getElementById("aadharNumber").value = data.Aadhar_Number || "";
    document.getElementById("dateOfJoining").value = formatDateForInput(data.Date_Of_Joining);
    document.getElementById("bankName").value = data.Bank_Name || "";
    document.getElementById("bankAccountNo").value = data.Bank_Account_No || "";
    document.getElementById("ifscCode").value = data.IFSC_Code || "";
    document.getElementById("phone").value = data.Phone || "";
    document.getElementById("shift").value = data.Shift || "";
    document.getElementById("status").value = data.Status || "Active";
    var locEl = document.getElementById("location");
    if (data.Location) locEl.value = data.Location;
    if (window.ProfilePhoto && data.Photo_URL) {
      ProfilePhoto.setExisting("groom", data.Photo_URL);
    }
    if (window.ProfilePhoto && data.Passport_Photo_URL) {
      ProfilePhoto.setExisting("groom_passport", data.Passport_Photo_URL);
    }
    if (window.ProfilePhoto && data.Passbook_Photo_URL) {
      ProfilePhoto.setExisting("groom_passbook", data.Passbook_Photo_URL);
    }
  }

  function getQueryParam(name) {
    var p = new URLSearchParams(window.location.search);
    var v = p.get(name) || p.get(name.toLowerCase());
    if (v) return v;
    try {
      if (window.top && window.top !== window.self) {
        var p2 = new URLSearchParams(window.top.location.search);
        return p2.get(name) || p2.get(name.toLowerCase()) || "";
      }
    } catch (e) {}
    return "";
  }

  function setEditUi() {
    document.getElementById("formTitle").textContent = "Edit Groom";
    document.getElementById("formSubtitle").textContent = "Update groom details, photos, and joining information.";
    document.getElementById("submitBtn").textContent = "Save Changes";
    try { document.title = "Edit Groom (Grooms)"; } catch (e) {}
  }

  function initEditMode() {
    editOriginalName = (window.__EDIT_GROOM_NAME__ || "").trim() || getQueryParam("groomName");
    if (!editOriginalName) return;
    editMode = true;
    setEditUi();
    var token = requireAuth();
    if (!token || !google.script.run) return;
    google.script.run
      .withSuccessHandler(fillGroomForm)
      .withFailureHandler(function(err) {
        alert(err.message || err);
      })
      .getGroomForEdit(editOriginalName, token);
  }

  function loadLocations() {
    const token = requireAuth();
    if (!token || !(window.google && google.script && google.script.run)) {
      return;
    }
    google.script.run
      .withSuccessHandler(function(options) {
        var locEl = document.getElementById("location");
        if (window.AppLocation) {
          window.AppLocation.applyField(locEl, options);
        } else {
          fillSelect(locEl, options.Location || [], "Select location");
        }
      })
      .withFailureHandler(function(error) {
        if (String(error && error.message || "").toLowerCase().includes("unauthorized")) {
          localStorage.removeItem("opsAuthToken");
          goToLogin();
          return;
        }
        alert("Unable to load locations: " + (error && error.message ? error.message : error));
      })
      .getDropdownOptions(FORM_KEY, token);
  }

  document.getElementById("addGroomForm").addEventListener("submit", function(e) {
    if (!this.checkValidity()) {
      e.preventDefault();
      this.reportValidity();
      return;
    }
    e.preventDefault();
    const payload = getPayload(this);
    if (window.ProfilePhoto) {
      Object.assign(payload, ProfilePhoto.readPayload("groom"), ProfilePhoto.readPayload("groom_passport"), ProfilePhoto.readPayload("groom_passbook"));
    }
    if (editMode) {
      payload._mode = "update";
      payload._originalName = editOriginalName;
    }
    const token = requireAuth();
    if (token && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() {
          if (editMode) {
            alert("Groom updated successfully.");
            google.script.run.withSuccessHandler(redirectToApp).buildAppPageUrl("dashboard", token, "", "staff");
            return;
          }
          alert("Groom added successfully.");
          document.getElementById("addGroomForm").reset();
          document.getElementById("status").value = "Active";
          loadLocations();
        })
        .withFailureHandler(function(error) {
          if (String(error.message || "").toLowerCase().includes("unauthorized")) {
            localStorage.removeItem("opsAuthToken");
            goToLogin();
            return;
          }
          alert("Submit failed: " + error.message);
        })
        .submitFormData(FORM_KEY, payload, token);
      return;
    }
    alert("Groom added (preview mode).");
    this.reset();
  });

  if (window.ProfilePhoto) {
    ProfilePhoto.mount("#groomPhotoMount", { id: "groom", label: "Photo" });
    ProfilePhoto.mount("#groomPassportPhotoMount", {
      id: "groom_passport",
      label: "Passport photo",
      dataKey: "Passport_Photo_Data",
      urlKey: "Passport_Photo_URL"
    });
    ProfilePhoto.mount("#groomPassbookPhotoMount", {
      id: "groom_passbook",
      label: "Bank passbook photo",
      dataKey: "Passbook_Photo_Data",
      urlKey: "Passbook_Photo_URL"
    });
  }
  loadLocations();
  initEditMode();
</script>
</body>
</html>
